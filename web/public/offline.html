<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Pastry Presence</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a20; color: #e8e8f5;
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 16px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 16px 0 4px; }
    p { margin: 0 0 20px; color: #a3a3c2; max-width: 320px; }
    button { border: 0; border-radius: 999px; padding: 10px 22px; font: inherit; font-weight: 600; background: #d4f51f; color: #0a0a20; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Presence needs an internet connection to check in and show live attendance. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
